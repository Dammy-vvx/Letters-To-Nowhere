<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Letters to Nowhere</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Mono:wght@400;500&family=Kalam:wght@300;400&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3ede2;--ink:#2b2520;--mut:#85796c;--acc:#cf4a30;--blue:#6d8fc7;--pap:#f7f0e0;--f:'Instrument Serif',Georgia,serif;--m:'DM Mono',ui-monospace,Menlo,monospace;--h:'Kalam','Segoe Print','Comic Sans MS',cursive;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#1c1916;--ink:#efe6d8;--mut:#a39787}}
:root[data-theme=dark]{--bg:#1c1916;--ink:#efe6d8;--mut:#a39787}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0}
body{background:var(--bg) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence baseFrequency='.8' numOctaves='2'/><feColorMatrix values='0 0 0 0 .5 0 0 0 0 .4 0 0 0 0 .3 0 0 0 .1 0'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>");color:var(--ink);font:400 15px/1.55 var(--m);min-height:100vh;overflow-x:hidden}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:3px}
.scr{display:none;min-height:100vh;padding:84px 20px 48px;flex-direction:column;align-items:center;justify-content:center;text-align:center;position:relative}
.scr.on{display:flex;animation:in .8s both}.scr.out{animation:out .26s both}
@keyframes in{from{opacity:0;transform:translateY(10px)}}@keyframes out{to{opacity:0;transform:translateY(-6px)}}
.bar{position:fixed;z-index:60;top:calc(env(safe-area-inset-top,0px) + 12px);left:16px;right:16px;display:flex;justify-content:space-between;align-items:center;pointer-events:none}
.bar>*{pointer-events:auto}
.wm{background:none;border:0;cursor:pointer;color:var(--ink);display:flex;align-items:center;gap:10px;padding:0;white-space:nowrap}
.wm .pm{width:44px;height:44px;flex:none;position:relative}
.wm .pm svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.wm .pm .rg{transform-origin:22px 22px;animation:sp 40s linear infinite}
.wm .pm .pn{transition:transform .4s cubic-bezier(.3,1.4,.5,1);transform-origin:22px 22px;transform:rotate(-12deg)}.wm:hover .pn{transform:rotate(8deg) translate(2px,-2px)}
.wm .lt{display:flex;flex-direction:column;align-items:flex-start;transform:rotate(-3deg);transform-origin:left center}
.wm .lt b{font:400 31px/.86 var(--f);letter-spacing:-.02em}
.wm .lt em{font:italic 400 25px/1 var(--f);color:var(--acc);margin:1px 0 0 20px;letter-spacing:-.01em}
body.stg .wm{visibility:hidden}
.pill{background:var(--pap);color:#2b2520;border:1.5px solid var(--ink);border-radius:99px;padding:14px 28px;font:500 15px var(--m);box-shadow:3px 3px 0 var(--ink);cursor:pointer;transition:transform .2s,box-shadow .2s}
.pill:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}.pill:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
.lk{background:none;border:0;color:var(--mut);text-decoration:underline;text-underline-offset:4px;cursor:pointer;font-size:13px;padding:8px}
.lk:hover{color:var(--ink)}
h1{font:400 clamp(46px,11.5vw,108px)/.96 var(--f);letter-spacing:-.02em;max-width:11ch;margin:0 auto}
h1 em{font-style:italic}
.sub{font:400 clamp(11px,2.8vw,13px)/1.8 var(--m);letter-spacing:.01em;max-width:42ch;margin:22px auto 34px;color:var(--mut)}
#home .sub{max-width:none;white-space:nowrap;font-size:clamp(10px,2.9vw,13px)}
#home .note{max-width:none;white-space:nowrap;font-size:clamp(9px,2.5vw,10.5px);opacity:.85}
.pill.hp{font:400 28px/1 var(--f);letter-spacing:-.005em;padding:15px 38px 17px}
.note{font-size:12.5px;color:var(--mut);margin-top:22px;max-width:36ch}
.as{position:absolute;width:clamp(70px,16vw,150px);opacity:.55;animation:sp 60s linear infinite;pointer-events:none}
@keyframes sp{to{transform:rotate(360deg)}}
#home{padding-top:178px;padding-bottom:170px}
#home>:not(.as):not(.dc){position:relative;z-index:2}
.dc{position:absolute;z-index:1;pointer-events:none;transform:rotate(var(--r,0deg));animation:bob var(--bd,7s) ease-in-out var(--dl,0s) infinite;will-change:transform}
@keyframes bob{50%{transform:translateY(-9px) rotate(calc(var(--r,0deg) + 2.5deg))}}
.dx{display:none!important}
@media(min-width:760px){#home{padding-top:84px;padding-bottom:48px}}
@media(min-width:760px){.dx{display:block!important}.bub.dx{display:flex!important}}
.stk{width:86px;padding:16px 10px 12px;background:#f2d66b;border:1.5px solid #2b2520;box-shadow:3px 3px 0 #2b2520;font:500 21px/.95 var(--h);color:#2b2520;text-align:left}
.stk:before{content:"";position:absolute;left:50%;top:-8px;width:34px;height:14px;margin-left:-17px;background:#ffffffa8;border:1px solid #2b2520;transform:rotate(-4deg)}
.win{width:122px;background:#fff;border:1.5px solid #2b2520;border-radius:8px;box-shadow:3px 3px 0 #2b2520;overflow:hidden;text-align:left;color:#2b2520}
.win b{display:flex;align-items:center;gap:4px;padding:5px 7px;background:#eef2f8;border-bottom:1.5px solid #2b2520;font:500 8.5px var(--m);color:#5d6675}
.win b i{width:6px;height:6px;border-radius:50%;background:var(--acc)}.win b i:nth-child(2){background:#e6b94a}.win b i:nth-child(3){background:var(--blue)}.win b span{margin-left:4px}
.win p{padding:8px 8px 9px;display:grid;gap:5px}.win p u{display:block;height:3px;background:#d9cfbd;border-radius:2px;text-decoration:none}
.win p u:last-child{width:46%;background:var(--acc);position:relative}
.tag{width:98px;background:#fff;border:1.5px solid #2b2520;border-radius:7px;box-shadow:3px 3px 0 #2b2520;overflow:hidden;text-align:center;color:#2b2520}
.tag b{display:block;background:var(--acc);color:#f7f0e0;font:500 9px/1 var(--m);letter-spacing:.2em;padding:6px 0 5px}
.tag span{display:block;font:400 20px/1 var(--h);padding:8px 4px 9px}
.bub{display:flex;align-items:center;gap:8px;padding:9px 13px;background:#dce6f7;border:1.5px solid #2b2520;border-radius:16px 16px 16px 3px;box-shadow:3px 3px 0 #2b2520;font:500 10.5px var(--m);color:#2b2520;white-space:nowrap}
.bub .dt i{width:5px;height:5px;margin:0 2px}
.kao{font:500 14px var(--m);color:var(--mut);letter-spacing:.04em;white-space:nowrap}
.dc svg{display:block;overflow:visible}
h2.t{font:400 clamp(32px,7vw,54px)/1.05 var(--f)}
.ch{display:flex;gap:26px;flex-wrap:wrap;justify-content:center;margin:34px 0 18px}
.opt{width:min(280px,82vw);height:210px;padding:18px;border:1.5px solid #2b2520;border-radius:14px;background:#fff;color:#2b2520;text-align:left;cursor:pointer;box-shadow:4px 4px 0 #2b2520;transition:transform .35s cubic-bezier(.3,1.4,.5,1);display:flex;flex-direction:column;gap:8px}
.opt:nth-child(1){transform:rotate(-2deg);background:#fbfcff}.opt:nth-child(2){transform:rotate(1.6deg);background:var(--pap)}
.opt:hover,.opt:focus-visible{transform:rotate(0) translateY(-5px)}
.opt b{font:400 30px var(--f)}.opt small{font-size:12.5px;color:#7b7064;margin-top:auto}
.dots i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;background:var(--acc)}.dots i:nth-child(2){background:#e6b94a}.dots i:nth-child(3){background:var(--blue)}
.mini{height:5px;border-radius:3px;background:#dfe5ee}.opt:nth-child(2) .mini{background:#e3d6bb;height:2px;border-radius:0;margin-top:9px}
.mail{width:min(680px,100%);background:#fff;color:#2b2520;border:1.5px solid #2b2520;border-radius:14px;box-shadow:5px 5px 0 #2b2520;text-align:left;overflow:hidden}
.mh{display:flex;justify-content:space-between;padding:12px 16px;background:#eef2f8;border-bottom:1.5px solid #2b2520;font-size:12.5px;color:#5d6675}
.row{display:flex;gap:12px;align-items:center;padding:4px 16px;border-bottom:1px solid #e8e8e8}
.row label{color:#8a8f99;font-size:13px;width:60px}
.row input{flex:1;border:0;outline:0;background:none;padding:10px 0;font-size:15px;min-width:0}
::placeholder{color:#a89d8c;opacity:1}
#eb{width:100%;min-height:min(300px,38vh);border:0;outline:0;resize:vertical;padding:16px;font:400 21px/1.55 var(--f);background:none;caret-color:var(--acc)}
.ft{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 16px;border-top:1px solid #e8e8e8;flex-wrap:wrap}
.pv{border:0;font-size:12.5px;color:#6d6358;padding:12px 16px;background:#faf7f0;border-top:1px solid #e8e8e8}
.pv p{margin-bottom:6px}.pv label{display:flex;gap:8px;align-items:flex-start;cursor:pointer;padding:2px 0}.pv input{accent-color:#cf4a30;margin-top:4px}
.sheet{--pl:50px;--pr:18px;position:relative;width:min(540px,100%);background:var(--pap);color:#2b2520;text-align:left;border-radius:3px;box-shadow:0 22px 40px -20px #0006,0 1px 0 #0003;transform:rotate(-.5deg);padding:36px var(--pr) 0 var(--pl);margin-top:8px;overflow:hidden}
.sheet:before{content:"";position:absolute;left:calc(var(--pl) - 14px);top:0;bottom:0;width:1px;background:#e5aa9c}
#letter{padding-left:12px;padding-right:12px}
.sheet input:not([type=radio]){border:0;outline:0;width:100%;font:400 20px/36px var(--h);padding:0;height:36px;display:block;background:linear-gradient(transparent 35px,#e0d2b4 35px) no-repeat}
#lb{display:block;width:100%;height:252px;border:0;outline:0;resize:none;background:repeating-linear-gradient(transparent 0 35px,#e0d2b4 35px 36px) 0 0/100% 36px local;font:400 19px/36px var(--h);caret-color:var(--acc);padding:0}
@media(min-height:820px){#lb{height:324px}}
.sheet .pv{margin:18px calc(var(--pr)*-1) 0 calc(var(--pl)*-1);padding:14px var(--pr) 14px var(--pl);background:#f1e8d3;border-top-color:#e0d2b4}
.sheet .ft{margin:0 calc(var(--pr)*-1) 0 calc(var(--pl)*-1);padding-left:var(--pl);padding-right:var(--pr);border-top-color:#e0d2b4}
.rowL{display:flex;gap:10px;align-items:center;height:36px;background:linear-gradient(transparent 35px,#e0d2b4 35px) no-repeat}.rowL span{font:13px var(--m);color:#8a7d6a;min-width:34px}.rowL input:not([type=radio]){background:none}
.nd{animation:nd .5s}@keyframes nd{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
#st{display:none;position:fixed;inset:0;z-index:40;padding:0;min-height:0;overflow:hidden;color:#2b2520;text-align:center;background:#e7ddcc}
#st.on{display:block;animation:none}
#desk,#sky{position:absolute;inset:0;transition:opacity 1.8s}
#desk{background:radial-gradient(ellipse at 50% 40%,#e9d9b9,#c4ae86 85%)}.me #desk{background:radial-gradient(ellipse at 50% 40%,#f8f2e8,#e3d8c6)}
#sky{background:linear-gradient(#a9c3e2,#dfe9f2 65%,#f6efe0);opacity:0}
.cl{will-change:transform;position:absolute;width:300px;height:100px;filter:blur(2.5px);opacity:.92;background:radial-gradient(circle at 25% 65%,#fff 0 27%,#fff0 28%),radial-gradient(circle at 50% 42%,#fff 0 34%,#fff0 35%),radial-gradient(circle at 76% 62%,#fff 0 27%,#fff0 28%)}
.me .cl{left:var(--l);top:0}.ml .cl{top:var(--t);left:0}
.fly .cl{animation:cd var(--d) linear infinite}.me.fly .cl{animation-name:cu}
@keyframes cd{from{transform:translateX(-340px) scale(var(--s))}to{transform:translateX(110vw) scale(var(--s))}}
@keyframes cu{from{transform:translateY(-30vh) scale(var(--s))}to{transform:translateY(130vh) scale(var(--s))}}
#ew{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}.ml #ew,.me #lw{display:none}
#ecard{position:relative;pointer-events:auto;width:min(90vw,460px);height:min(62vh,440px);background:#fff;border:1.5px solid #2b2520;border-radius:14px;box-shadow:5px 5px 0 #2b2520,0 30px 50px -24px #0005;opacity:0;transform:scale(.9);transition:opacity .9s,transform .9s,width 1.4s cubic-bezier(.6,0,.2,1),height 1.4s cubic-bezier(.6,0,.2,1),border-radius 1.4s}
#ecard.show{opacity:1;transform:none;animation:fl 5s ease-in-out .9s infinite}
#ecard.sm{width:130px;height:88px;border-radius:6px;box-shadow:3px 3px 0 #2b2520}
@keyframes fl{50%{transform:translateY(-8px) rotate(.4deg)}}
.in{position:absolute;inset:0;display:flex;flex-direction:column;text-align:left;overflow:hidden;transition:opacity .45s}.sm .in{opacity:0}
.in .row{padding:9px 16px}.in .row span{font-size:14px}.in .row label{width:60px}
#ecb{flex:1;overflow:auto;padding:16px;font:400 20px/1.5 var(--f);white-space:pre-wrap;word-break:break-word}
#env{position:absolute;inset:0;width:100%;height:100%;opacity:0;transition:opacity .6s .6s}.sm #env{opacity:1}
#lw{will-change:transform;position:absolute;left:50%;top:50%;width:340px;height:442px;margin:-221px 0 0 -170px;pointer-events:none}
#lp{position:absolute;inset:0;pointer-events:auto;background:var(--pap) repeating-linear-gradient(transparent 0 31px,#e0d2b4 31px 32px) 0 52px;box-shadow:0 26px 40px -20px #0007;padding:36px 28px 26px 44px;display:flex;flex-direction:column;text-align:left;font:400 18px/32px var(--h);opacity:0;transform:translateY(40px) rotate(-3deg) scale(.96);transition:opacity 1s,transform 1.1s,box-shadow .9s}
#lp:before{content:"";position:absolute;left:32px;top:0;bottom:0;width:1px;background:#e5aa9c}
#lp.show{opacity:1;transform:rotate(-1deg)}#lp.shr{transform:rotate(0)}
#lpb{flex:1;overflow:auto;white-space:pre-wrap;word-break:break-word}
#pl{position:absolute;inset:0;width:100%;height:100%;overflow:visible;opacity:0;transition:opacity .35s,filter .7s;filter:drop-shadow(0 12px 12px #0004)}
#pl.hv{animation:fl 3s ease-in-out infinite}
#pl polygon{fill:#f3ead6;stroke:#bba983;stroke-width:.9;stroke-linejoin:round;transition:fill .7s}
#stat{position:absolute;left:0;right:0;bottom:12vh;text-align:center;font:500 15px var(--m);letter-spacing:.06em;opacity:0;transition:opacity .45s}
#ico{height:26px;display:flex;justify-content:center;align-items:center;margin-bottom:6px}
.dt i{display:inline-block;width:6px;height:6px;margin:0 3px;border-radius:50%;background:#2b2520;animation:dp 1.1s infinite}.dt i:nth-child(2){animation-delay:.18s}.dt i:nth-child(3){animation-delay:.36s}
@keyframes dp{40%{transform:translateY(-6px);opacity:.4}}
.sh{animation:lk 1.4s both}@keyframes lk{0%,55%{transform:translateY(-3.5px)}100%{transform:none}}
#fin{position:absolute;inset:0;display:grid;place-content:center;padding:24px;opacity:0;transition:opacity 1.8s;pointer-events:none}
#fin h2{font:400 clamp(34px,8vw,66px)/1.04 var(--f);max-width:16ch;margin:0 auto}
#fin p{font:italic 400 clamp(18px,3.4vw,24px) var(--f);margin-top:16px;color:#5b5247}
#skip{position:absolute;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);color:#5b5247}
#emsg{font:400 clamp(34px,8vw,64px)/1.05 var(--f);max-width:15ch;margin:0 auto 14px}
#end .sub{margin-top:0}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style></head><body>

<svg class="dc dx" width="56" viewBox="0 0 60 60" style="top:70%;left:19%;--r:10deg;--bd:10s;--dl:-2s" aria-hidden="true"><g fill="#fff" stroke="#2b2520" stroke-width="1.8"><ellipse cx="30" cy="12" rx="7" ry="11"/><ellipse cx="30" cy="48" rx="7" ry="11"/><ellipse cx="12" cy="30" rx="11" ry="7"/><ellipse cx="48" cy="30" rx="11" ry="7"/><ellipse cx="17" cy="17" rx="7" ry="11" transform="rotate(-45 17 17)"/><ellipse cx="43" cy="43" rx="7" ry="11" transform="rotate(-45 43 43)"/><ellipse cx="43" cy="17" rx="7" ry="11" transform="rotate(45 43 17)"/><ellipse cx="17" cy="43" rx="7" ry="11" transform="rotate(45 17 43)"/></g><circle cx="30" cy="30" r="8" fill="#e6b94a" stroke="#2b2520" stroke-width="1.8"/></svg>
<svg class="dc dx" width="30" viewBox="0 0 30 30" style="top:20%;right:20%;--r:0deg;--bd:5s" aria-hidden="true"><path d="M15 1c1 8 6 13 14 14-8 1-13 6-14 14C14 21 9 16 1 15 9 14 14 9 15 1z" fill="#6d8fc7" stroke="#2b2520" stroke-width="1.6" stroke-linejoin="round"/></svg>
<h1>Dear, <em>whoever you never got to say it to.</em></h1>
<p class="sub">Every unsent word deserves somewhere to go</p>
<button class="pill hp" data-go="choose" data-f>Begin writing</button>
<p class="note">Nothing you write here is ever sent to anyone.</p>
</section>

<section id="choose" class="scr">
<h2 class="t">How would you like to say it?</h2>
<div class="ch">
<button class="opt" data-go="email" aria-label="An email"><span class="dots"><i></i><i></i><i></i></span><b>An email</b><span class="mini"></span><span class="mini" style="width:70%"></span><small>New message, no address needed</small></button>
<button class="opt" data-go="letter" aria-label="A letter"><b>A letter</b><span style="font:400 18px var(--h);color:#5b5247">Dear you,</span><span class="mini"></span><span class="mini"></span><small>Pen, paper, and time</small></button>
</div>
<button class="lk" data-go="home">Back</button>
</section>

<section id="email" class="scr">
<div class="mail">
<div class="mh"><span class="dots"><i></i><i></i><i></i></span><span>New message</span></div>
<div class="row"><label for="eto">To</label><input id="eto" data-f placeholder="Their name" autocomplete="off" maxlength="80"></div>
<div class="row"><label for="esj">Subject</label><input id="esj" placeholder="Optional" autocomplete="off" maxlength="120"></div>
<textarea id="eb" placeholder="Write whatever you need to…" aria-label="Message"></textarea>
<div class="ft"><button class="lk" data-go="choose">Back</button><button class="pill" id="se">Send</button></div>
</div>
</section>

<section id="letter" class="scr">
<div class="sheet">
<div class="rowL"><span>To</span><input id="lto" data-f placeholder="Their name" autocomplete="off" maxlength="80"></div>
<input id="lsal" placeholder="Dear you," aria-label="Salutation" maxlength="100">
<textarea id="lb" placeholder="Start anywhere…" aria-label="Letter"></textarea>
<input id="lso" placeholder="With love, or not." aria-label="Sign-off" maxlength="100">
<div class="ft"><button class="lk" data-go="choose">Back</button><button class="pill" id="sl">Let it go</button></div>
</div>
</section>

<section id="end" class="scr">
<p id="emsg"></p>
<p class="sub" id="esub"></p>
<button class="pill" data-go="choose">Write another</button>
<button class="lk" data-go="home" style="margin-top:14px">Back home</button>
<p class="note" id="kept"></p>
</section>

<section id="st" class="scr" aria-label="Letting go">
<div id="desk"></div><div id="sky"></div>
<div id="ew"><div id="ecard">
<div class="in"><div class="mh"><span class="dots"><i></i><i></i><i></i></span><span>Sending</span></div>
<div class="row"><label>To</label><span id="ecto"></span></div><div class="row" id="ecsr"><label>Subject</label><span id="ecsj"></span></div>
<div id="ecb"></div></div>
<svg id="env" viewBox="0 0 130 88" preserveAspectRatio="none" aria-hidden="true"><rect x="1" y="1" width="128" height="86" rx="6" fill="#f7f0e0" stroke="#2b2520" stroke-width="2"/><path d="M2 4L65 52L128 4" fill="none" stroke="#2b2520" stroke-width="2"/><circle cx="65" cy="52" r="6" fill="#cf4a30"/></svg>
</div></div>
<div id="lw"><div id="lp"><div id="lps"></div><div id="lpb"></div><div id="lpo" style="text-align:right"></div></div>
<svg id="pl" viewBox="0 0 200 260" aria-hidden="true"><polygon id="pa"/><polygon id="pb"/><polygon id="pc"/></svg></div>
<div id="stat" aria-live="polite"><div id="ico"></div><span id="stx"></span></div>
<div id="fin"><h2 id="fh"></h2><p id="fp"></p></div>
<button class="lk" id="skip">Skip</button>
</section>
</main>

<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const RM=matchMedia('(prefers-reduced-motion:reduce)').matches,S=RM?.15:1;
let snd=false,AC,run=0,saved='';
const MSG=["Some things don’t need an answer.","You said what you needed to say.","Not every ending comes with an explanation.","You can miss someone and still move forward.","Somewhere, your words have found their place."];
/* sound (off by default) */
const ac=()=>AC||(AC=new(window.AudioContext||webkitAudioContext)());
function tone(f,d=.5,v=.05,at=0){if(!snd)return;const c=ac(),o=c.createOscillator(),g=c.createGain(),s=c.currentTime+at;o.frequency.value=f;g.gain.setValueAtTime(0,s);g.gain.linearRampToValueAtTime(v,s+.03);g.gain.exponentialRampToValueAtTime(.0001,s+d);o.connect(g).connect(c.destination);o.start(s);o.stop(s+d)}
function noise(d=.3,v=.05,f=1800){if(!snd)return;const c=ac(),n=c.sampleRate*d|0,b=c.createBuffer(1,n,c.sampleRate),a=b.getChannelData(0);for(let i=0;i<n;i++)a[i]=(Math.random()*2-1)*(1-i/n);const s=c.createBufferSource(),g=c.createGain(),h=c.createBiquadFilter();h.type='bandpass';h.frequency.value=f;g.gain.value=v;s.buffer=b;s.connect(h).connect(g).connect(c.destination);s.start()}
/* navigation */
async function go(id){const c=$('.scr.on');if(c){c.classList.add('out');await new Promise(r=>setTimeout(r,RM?0:260));c.classList.remove('on','out')}$('#'+id).classList.add('on');document.body.classList.toggle('stg',id==='st');scrollTo(0,0);const f=$('#'+id+' [data-f]');f&&setTimeout(()=>f.focus({preventScroll:true}),400)}
document.addEventListener('click',e=>{const b=e.target.closest('[data-go]');if(b){run++;go(b.dataset.go)}});
/* privacy block */
/* letter salutation follows the name */
$('#lto').oninput=e=>{const s=$('#lsal');if(!s.dataset.t)s.value=e.target.value.trim()?'Dear '+e.target.value.trim()+',':''};
$('#lsal').oninput=e=>{e.target.dataset.t=e.target.value?1:''};
/* clouds */
for(let i=0;i<9;i++){const c=document.createElement('i');c.className='cl';const d=14+Math.random()*16;c.style.cssText=`--l:${Math.random()*85}vw;--t:${Math.random()*70}vh;--s:${.6+Math.random()*1.1};--d:${d}s;animation-delay:-${Math.random()*d}s`;$('#sky').appendChild(c)}
/* paper-fold geometry: flat paper, corners in, edges in */
const K=[[[[100,0],[200,0],[200,260],[0,260],[0,0]],[[0,0],[100,0],[0,100]],[[200,0],[100,0],[200,100]]],
[[[100,0],[200,100],[200,260],[0,260],[0,100]],[[100,100],[100,0],[0,100]],[[100,100],[100,0],[200,100]]],
[[[100,0],[200,241],[200,260],[0,260],[0,241]],[[100,141],[100,0],[0,241]],[[100,141],[100,0],[200,241]]]];
function draw(a,b,w){['pa','pb','pc'].forEach((id,i)=>$('#'+id).setAttribute('points',K[a][i].map((p,j)=>{const q=K[b][i][j];return(p[0]+(q[0]-p[0])*w).toFixed(1)+','+(p[1]+(q[1]-p[1])*w).toFixed(1)}).join(' ')))}
const tw=(a,b,d,i)=>new Promise((r,j)=>{const t0=performance.now();(function f(n){if(i!==run)return j();const t=Math.min(1,(n-t0)/(d*S));draw(a,b,(1-Math.cos(Math.PI*t))/2);t<1?requestAnimationFrame(f):r()})(t0)});
const sm=t=>t*t*(3-2*t);
function fly(dur,i,W,H,s0,fade){return new Promise((res,rej)=>{const w=$('#lw'),t0=performance.now(),D=dur*S;w.style.transition='none';w.style.willChange='transform,opacity';
const P=t=>{const u=t*(.3+.7*t*t),m=1-u,a=3*m*m*u,b=3*m*u*u,c=u*u*u,x=a*.22*W+b*.42*W+c*.64*W,y=-(a*0+b*.1*H+c*.5*H),wob=Math.sin(t*9)*t*(1-t)*4*7;return[x,y+wob]};
let ang=90;
(function f(n){if(i!==run)return rej();const t=Math.min(1,(n-t0)/D),[x,y]=P(t),[x2,y2]=P(Math.min(1,t+.004)),[x1,y1]=P(Math.max(0,t-.004));
const tg=Math.atan2(y2-y1,x2-x1)*180/Math.PI+90;ang+=(tg-ang)*.18;
const sc=s0*(1-.86*sm(t)),op=t<.72?1:1-sm((t-.72)/.28);
w.style.transform=`translate3d(${x.toFixed(2)}px,${y.toFixed(2)}px,0) rotate(${ang.toFixed(2)}deg) scale(${sc.toFixed(4)})`;w.style.opacity=op.toFixed(3);
t<1?requestAnimationFrame(f):res()})(t0)})}
const mk=()=>{const i=++run;return[i,ms=>new Promise((r,j)=>setTimeout(()=>i===run?r():j(),ms*S))]};
const st=(t,ic)=>{const s=$('#stat');s.style.opacity=0;setTimeout(()=>{$('#stx').textContent=t;$('#ico').innerHTML=ic;s.style.opacity=1},RM?0:350)};
const DOTS='<span class="dt"><i></i><i></i><i></i></span>',LOCK='<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path class="sh" d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>';
const fin=(h,p)=>{$('#stat').style.opacity=0;$('#fh').textContent=h;$('#fp').textContent=p;$('#fin').style.opacity=1;[523,659,784].forEach((f,k)=>tone(f,1.6,.04,k*.25))};
function reset(m){const s=$('#st');s.classList.remove('me','ml','fly');s.classList.add('m'+m);$('#fin').style.opacity=0;$('#stat').style.opacity=0;$('#sky').style.opacity=0;$('#desk').style.opacity=1;$('#ecard').className='';$('#ew').getAnimations().forEach(a=>a.cancel());const w=$('#lw');w.getAnimations().forEach(a=>a.cancel());w.style.cssText='';$('#lp').className='';$('#lp').style.opacity='';$('#lp').style.transition='';$('#pl').style.filter='';$('#pl').style.opacity=0;$('#pl').className='';$$('#pl polygon').forEach(p=>p.style.fill='');draw(0,1,0)}
function finish(){const m=MSG[Math.random()*MSG.length|0];$('#emsg').textContent=m;$('#esub').textContent='';$('#kept').innerHTML=saved==='y'?'A private copy is kept on this device only. <button class="lk" id="del">Delete it</button>':saved==='f'?'A copy couldn’t be kept here, so nothing was saved.':'No copy was kept.';const d=$('#del');d&&(d.onclick=()=>{try{localStorage.removeItem('ltn')}catch(_){}$('#kept').textContent='Deleted. Nothing is kept.'});go('end')}
$('#skip').onclick=()=>{run++;finish()};
function stash(m,o){saved='';return;try{const a=JSON.parse(localStorage.getItem('ltn')||'[]');a.push({...o,m,d:Date.now()});localStorage.setItem('ltn',JSON.stringify(a));saved='y'}catch(_){saved='f'}}
function bad(el){el.classList.remove('nd');void el.offsetWidth;el.classList.add('nd');el.focus()}
/* EMAIL */
$('#se').onclick=async()=>{const b=$('#eb'),t=b.value.trim();if(!t)return bad(b);
const to=$('#eto').value.trim(),sj=$('#esj').value.trim();stash('e',{to,sj,t});
$('#ecto').textContent=to||'whoever you never got to say it to';$('#ecsj').textContent=sj;$('#ecsr').style.display=sj?'':'none';$('#ecb').textContent=t;
['#eb','#eto','#esj'].forEach(s=>$(s).value='');
const[i,z]=mk();reset('e');try{await go('st');$('#ecard').classList.add('show');noise(1,.02,500);await z(2800);
st('Connecting...',DOTS);tone(392,.7);await z(2200);
st('Encrypting...',LOCK);tone(330,.2);tone(440,.2,.04,.2);await z(1300);noise(.08,.1,3000);await z(900);
st('Sending...',DOTS);$('#ecard').classList.add('sm');noise(1.2,.03,700);await z(2200);
$('#stat').style.opacity=0;$('#sky').style.opacity=1;$('#st').classList.add('fly');noise(3,.03,900);await z(600);
$('#ew').animate([{transform:'translateY(0) scale(1)',opacity:1},{transform:'translateY(-30vh) scale(.75) rotate(-5deg)',opacity:1,offset:.4},{transform:'translateY(-82vh) scale(.1) rotate(7deg)',opacity:0}],{duration:5600*S,easing:'cubic-bezier(.45,0,.6,1)',fill:'forwards'});await z(5400);
fin('Somewhere in the clouds, forever.','Your words don’t need a destination.');await z(6000);finish()}catch(_){}};
/* LETTER */
$('#sl').onclick=async()=>{const b=$('#lb'),t=b.value.trim();if(!t)return bad(b);
const to=$('#lto').value.trim(),sal=$('#lsal').value.trim(),so=$('#lso').value.trim();stash('l',{to,sal,t,so});
$('#lps').textContent=sal;$('#lpb').textContent=t;$('#lpo').textContent=so;
['#lb','#lto','#lsal','#lso'].forEach(s=>$(s).value='');$('#lsal').dataset.t='';
const[i,z]=mk(),k=Math.min(1,(innerWidth-32)/340,(innerHeight-150)/442),w=$('#lw'),W=innerWidth,H=innerHeight;reset('l');w.style.transform=`scale(${k})`;
try{await go('st');$('#lp').classList.add('show');noise(.5,.05,1400);await z(2800);
noise(.4,.05,1200);w.style.transition='transform .9s cubic-bezier(.5,0,.2,1)';w.style.transform=`scale(${k*.8})`;$('#lp').classList.add('shr');await z(1000);
$('#lp').style.transition='opacity .35s';$('#pl').style.opacity=1;$('#lp').style.opacity=0;await z(500);
noise(.7,.07,2200);await tw(0,1,1400,i);$('#pb').style.fill='#e9ddc2';$('#pc').style.fill='#faf4e4';await z(350);
noise(.7,.07,2600);await tw(1,2,1400,i);await z(500);
const s0=k*.62;w.style.transition='transform 1.1s cubic-bezier(.5,0,.2,1)';w.style.transform=`scale(${s0}) rotate(90deg)`;noise(.5,.04,1000);await z(1300);
$('#pl').classList.add('hv');tone(523,1.2,.03);await z(2000);
$('#sky').style.opacity=1;$('#desk').style.opacity=0;$('#st').classList.add('fly');noise(3.5,.05,800);
$('#pl').style.filter='drop-shadow(0 0 0 #0000)';w.style.transformOrigin='50% 50%';await fly(6500,i,W,H,s0);
fin('And just like that, it was said.','Not everything needs to be heard to be said.');await z(6000);finish()}catch(_){}};
</script></body></html>
